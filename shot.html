<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>촬영용 · 영어 회화 앱</title>
<style>
  body { margin: 0; background: #dfe3ee; font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; }
  .devices { display: flex; gap: 18px; padding: 14px; align-items: flex-start; }
  iframe { border: 0; background: #fff; border-radius: 22px; box-shadow: 0 10px 30px rgba(20,24,45,.18); }
  .cap { font-size: 12px; color: #4a5068; text-align: center; margin-top: 6px; font-weight: 700; }
</style>
</head>
<body>
<script>
/* 개발용 페이지 — 이 페이지를 열 때는 앱 서비스워커를 잠시 끊어 예전 껍데기 캐시가
   iframe 으로 흘러들지 않게 한다(앱 화면을 다시 열면 스스로 재등록된다) */
if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
  navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); });
}
if (window.caches) { caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); }); }
</script>
<div class="devices">
  <div><iframe id="f390" width="390" height="844"></iframe><div class="cap">390px</div></div>
  <div><iframe id="f360" width="360" height="844"></iframe><div class="cap">360px</div></div>
</div>
<script>
/* 캐시된 index.html 이 옛 app.js 를 물고 오지 않게 매번 새로 받는다 */
(function () {
  var cb = '?qa=1&cb=' + Date.now();
  document.getElementById('f390').src = 'index.html' + cb;
  document.getElementById('f360').src = 'index.html' + cb;
})();
</script>
<script>
const state = new URLSearchParams(location.search).get('state') || 'home';
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function drive(f) {
  await sleep(2600);
  const w = f.contentWindow, d = f.contentDocument;
  const q = s => d.querySelector(s);
  if (!w || !d || !q('#presetSeg') || !w.__QA) { document.title = 'ERR not ready'; return; }
  w.confirm = () => true;
  const qa = () => w.__QA;
  const answer = ok => {
    const card = qa().state().S.queue[qa().state().S.i].c;
    if (!q('#quizCard').hidden) {
      const ans = qa().options().answer;
      const btns = Array.from(d.querySelectorAll('#quizOptions .opt'));
      const b = ok ? btns.find(x => x.dataset.val === ans) : btns.find(x => x.dataset.val !== ans);
      if (b) b.click();
    }
  };
  try {
    if (state === 'home') {
      q('#startBtn').click(); await sleep(300);
      answer(true); await sleep(120); q('#fbNext').click(); await sleep(120);
      answer(true); await sleep(120); q('#fbNext').click(); await sleep(120);
      answer(true); await sleep(200);
      q('#studyBack').click(); await sleep(400);
    } else if (state === 'combo') {
      q('#startBtn').click(); await sleep(300);
      for (let i = 0; i < 4; i++) { answer(true); await sleep(90); if (q('#fbNext')) q('#fbNext').click(); await sleep(90); }
      w.scrollTo(0, 0); await sleep(200);
    } else if (state === 'feedback') {
      q('#startBtn').click(); await sleep(300);
      answer(false); await sleep(400);
    } else if (state === 'result') {
      q('#startBtn').click(); await sleep(300);
      let n = 0;
      while (q('#resultBox').hidden && n++ < 14) {
        const i = qa().state().S.i;
        answer(n % 3 !== 0); await sleep(90);
        if (q('#fbNext') && !q('#feedback').hidden) q('#fbNext').click();
        await sleep(90);
      }
      await sleep(300);
    } else if (state === 'goal') {
      q('.tab[data-tab="home"]').click(); await sleep(200);
    } else if (state === 'stats') {
      q('.tab[data-tab="stats"]').click(); await sleep(400);
    } else if (state === 'list') {
      q('.tab[data-tab="list"]').click(); await sleep(400);
    } else if (state === 'speak') {
      q('.tab[data-tab="speak"]').click(); await sleep(300);
      q('#speakType .seg[data-type="sent"]').click(); await sleep(120);
      q('#speakLv .chip[data-lv="6"]').click(); await sleep(120);
      q('#speakStart').click(); await sleep(400);
      const st = qa().speakState();
      if (st) qa().speakCheck(st.target);
      await sleep(400);
    } else if (state === 'chat') {
      q('.tab[data-tab="chat"]').click(); await sleep(350);
      q('#topicGrid .topic[data-t="cafe"]').click(); await sleep(350);
      qa().chatSend('I very like this cafe. Yesterday I go here.'); await sleep(600);
      qa().chatSend('Can I get a large latte?'); await sleep(600);
    } else if (state === 'hint' || state === 'hintdark') {
      if (state === 'hintdark') { q('#themeBtn').click(); await sleep(250); }
      q('.tab[data-tab="chat"]').click(); await sleep(320);
      q('#topicGrid .topic[data-t="cafe"]').click(); await sleep(320);
      qa().chatSend('I very like this cafe. Yesterday I go here.'); await sleep(700);
      for (let i = 0; i < 3; i++) { const hb = q('#chatHintBtn'); if (hb) { hb.click(); await sleep(120); } }
      await sleep(200);
    } else if (state === 'recall' || state === 'recalldark') {
      if (state === 'recalldark') { q('#themeBtn').click(); await sleep(250); }
      q('#startBtn').click(); await sleep(300);
      let n2 = 0;
      while (q('#resultBox').hidden && n2++ < 14) {
        answer(n2 % 3 !== 0); await sleep(80);
        if (q('#fbNext') && !q('#feedback').hidden) q('#fbNext').click();
        await sleep(80);
      }
      await sleep(320);
    } else if (state === 'v42chunk' || state === 'v42chunkdark') {
      if (state === 'v42chunkdark') { q('#themeBtn').click(); await sleep(250); }
      qa().startConv('blank'); await sleep(350);
      for (let i = 0; i < 12; i++) {
        const st = qa().state();
        if (!st.S || st.S.i >= st.S.queue.length) break;
        const card = st.S.queue[st.S.i].c;
        const pd = qa().pattern(card.w);
        const ok = qa().options().answer;
        const btns = Array.from(d.querySelectorAll('#blankOptions .opt'));
        const b = btns.find(x => String(x.dataset.val).toLowerCase() === String(ok).toLowerCase());
        if (b) b.click(); else break;
        await sleep(160);
        if (pd && pd.slots.length && q('#feedback .pat')) break;
        if (q('#fbNext') && !q('#feedback').hidden) q('#fbNext').click();
        await sleep(150);
      }
      await sleep(250);
      const pb = q('#feedback .pat');
      if (pb) pb.scrollIntoView({ block: 'center' });
      await sleep(250);
    } else if (state === 'v42chat') {
      q('.tab[data-tab="chat"]').click(); await sleep(320);
      q('#topicGrid .topic[data-t="daily"]').click(); await sleep(320);
      qa().chatSend('I very like this place. Yesterday I go to the gym.'); await sleep(700);
      qa().chatSend('He go to school everyday.'); await sleep(700);
      qa().chatClose(); await sleep(350);
      const cards = Array.from(d.querySelectorAll('.card'));
      const fc = cards.find(x => x.textContent.indexOf('내 문장 기록') > -1);
      if (fc) fc.scrollIntoView({ block: 'start' });
      await sleep(250);
    } else if (state === 'v43rec' || state === 'v43recdark') {
      if (state === 'v43recdark') { q('#themeBtn').click(); await sleep(250); }
      qa().startConv('blank'); await sleep(350);
      for (let i = 0; i < 12; i++) {
        const st = qa().state();
        if (!st.S || st.S.i >= st.S.queue.length) break;
        const card = st.S.queue[st.S.i].c;
        const pd = qa().pattern(card.w);
        const ok = qa().options().answer;
        const btns = Array.from(d.querySelectorAll('#blankOptions .opt'));
        const b = btns.find(x => String(x.dataset.val).toLowerCase() === String(ok).toLowerCase());
        if (b) b.click(); else break;
        await sleep(170);
        if (pd && pd.slots.length && q('#feedback .pat')) break;
        if (q('#fbNext') && !q('#feedback').hidden) q('#fbNext').click();
        await sleep(150);
      }
      await sleep(250);
      const rb = q('#feedback .chk-rec');
      if (rb) rb.scrollIntoView({ block: 'center' });
      await sleep(250);
    } else if (state === 'v43chat') {
      q('.tab[data-tab="chat"]').click(); await sleep(320);
      q('#topicGrid .topic[data-t="daily"]').click(); await sleep(320);
      qa().chatSend('I very like this place. Yesterday I go to the gym.'); await sleep(700);
      qa().chatSend('He go to school everyday.'); await sleep(700);
      qa().chatSend('I very like this music.'); await sleep(700);
      qa().chatClose(); await sleep(350);
      const cards2 = Array.from(d.querySelectorAll('.card'));
      const fc2 = cards2.find(x => x.textContent.indexOf('내 문장 기록') > -1);
      if (fc2) fc2.scrollIntoView({ block: 'start' });
      await sleep(250);
      const chip = d.querySelector('#chatFixTop .fix-top-chip');
      if (chip) { chip.click(); await sleep(300); if (fc2) fc2.scrollIntoView({ block: 'start' }); await sleep(250); }
    } else if (state === 'v44pat' || state === 'v44patdark') {
      /* 2차 틀 사전(조동사+주어) 패널 — 'Could you ___?' 카드를 찾아 피드백을 연다 */
      if (state === 'v44patdark') { q('#themeBtn').click(); await sleep(250); }
      qa().startConv('blank'); await sleep(380);
      for (let i = 0; i < 16; i++) {
        const st = qa().state();
        if (!st.S || st.S.i >= st.S.queue.length) break;
        const card = st.S.queue[st.S.i].c;
        const pd = qa().pattern(card.w);
        const ok = qa().options().answer;
        const btns = Array.from(d.querySelectorAll('#blankOptions .opt'));
        const b = btns.find(x => String(x.dataset.val).toLowerCase() === String(ok).toLowerCase());
        if (b) b.click(); else break;
        await sleep(180);
        if (pd && pd.tier === 2 && q('#feedback .pat')) break;
        if (q('#fbNext') && !q('#feedback').hidden) q('#fbNext').click();
        await sleep(150);
      }
      await sleep(250);
      const pb2 = q('#feedback .pat');
      if (pb2) pb2.scrollIntoView({ block: 'center' });
      await sleep(250);
    } else if (state === 'v44cmp' || state === 'v44cmpdark') {
      /* 비교 듣기 원어민 속도 — 녹음 이후 상태를 점검용 녹음으로 만든다 */
      if (state === 'v44cmpdark') { q('#themeBtn').click(); await sleep(250); }
      qa().startConv('blank'); await sleep(380);
      for (let i = 0; i < 12; i++) {
        const st = qa().state();
        if (!st.S || st.S.i >= st.S.queue.length) break;
        const card = st.S.queue[st.S.i].c;
        const ok = qa().options().answer;
        const btns = Array.from(d.querySelectorAll('#blankOptions .opt'));
        const b = btns.find(x => String(x.dataset.val).toLowerCase() === String(ok).toLowerCase());
        if (b) b.click(); else break;
        await sleep(180);
        if (q('#feedback .chk-rec')) break;
        if (q('#fbNext') && !q('#feedback').hidden) q('#fbNext').click();
        await sleep(150);
      }
      await sleep(200);
      qa().recFake(3);
      await sleep(300);
      const spb = d.querySelector('#feedback .chk-rec .cmp-sp[data-recp="0.75"]');
      if (spb) spb.click();
      await sleep(400);
      const rb2 = q('#feedback .chk-rec');
      if (rb2) rb2.scrollIntoView({ block: 'center' });
      await sleep(250);
    } else if (state === 'v44fix') {
      /* 교정 기간 7일/30일/전체 + 규칙 미니 추이 */
      q('.tab[data-tab="chat"]').click(); await sleep(320);
      q('#topicGrid .topic[data-t="daily"]').click(); await sleep(320);
      qa().chatSend('I very like this place. Yesterday I go to the gym.'); await sleep(650);
      qa().chatSend('He go to school everyday.'); await sleep(650);
      qa().chatClose(); await sleep(300);
      qa().seedFixes([
        { days: 0, notes: [{ from: 'a', to: 'b', why: '시제' }] },
        { days: 3, notes: [{ from: 'a', to: 'b', why: '시제' }, { from: 'c', to: 'd', why: '관사' }] },
        { days: 20, notes: [{ from: 'e', to: 'f', why: '시제' }, { from: 'g', to: 'h', why: '전치사' }] },
        { days: 45, notes: [{ from: 'i', to: 'j', why: '시제' }, { from: 'k', to: 'l', why: '관사' }] }
      ]);
      await sleep(300);
      const fp = q('#chatFixTrend .fp-chip[data-p="30"]');
      if (fp) { fp.click(); await sleep(300); }
      const chip2 = d.querySelector('#chatFixTop .fix-top-chip[data-why="시제"]');
      if (chip2) { chip2.click(); await sleep(300); }
      const cards3 = Array.from(d.querySelectorAll('.card'));
      const fc3 = cards3.find(x => x.textContent.indexOf('내 문장 기록') > -1);
      if (fc3) fc3.scrollIntoView({ block: 'start' });
      await sleep(300);
    } else if (state === 'dark') {
      q('#themeBtn').click(); await sleep(250);
      q('#startBtn').click(); await sleep(300);
      answer(true); await sleep(150); q('#fbNext').click(); await sleep(150);
      answer(false); await sleep(400);
    }
  } catch (e) {
    document.title = 'ERR ' + e.message;
  }
}

drive(document.getElementById('f390'));
drive(document.getElementById('f360'));
</script>
</body>
</html>
