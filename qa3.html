<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>QA v4.3.0 전수 클릭 점검</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; margin: 0; padding: 14px; background: #eef0f6; color: #191c2b; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  #sum { font-size: 13px; font-weight: 800; margin-bottom: 8px; }
  #out { font-size: 11px; line-height: 1.45; background: #fff; border-radius: 10px; padding: 10px; margin-bottom: 14px; white-space: pre-wrap; font-family: ui-monospace, monospace; max-height: 60vh; overflow: auto; }
  .ok { color: #0a7d54; font-weight: 700; }
  .bad { color: #c9415a; font-weight: 700; }
  .frames { display: flex; gap: 10px; align-items: flex-start; overflow-x: auto; }
  iframe { border: 1px solid #c9cede; border-radius: 10px; background: #fff; flex: 0 0 auto; }
</style>
</head>
<body>
<h1>v4.3.0 전수 클릭 점검 — 틀 사전 88개·생성 문장 전수 검사 · 청크 b 경계 정렬 · 내 발음 녹음/원어민 비교 · 교정 7일 추이+규칙 필터 · 기존 513항목 · 360/390</h1>
<div id="sum">시작 중…</div>
<pre id="out">…</pre>
<div class="frames" id="frames"></div>
<script>
/* ============================================================
 *  전수 클릭 점검 하네스
 *  - index.html?qa=1 을 360·390px iframe 으로 띄워 실제 DOM 클릭으로 검사
 *  - 결과는 매번 #out 에 즉시 기록 (중간에 페이지가 넘어가도 남게)
 * ============================================================ */
var WIDTHS = [360, 390];
var out = document.getElementById('out');
var sum = document.getElementById('sum');
var checks = [];
var errors = [];
var dirty = false;

function rec(w, name, ok, detail) {
  checks.push({ w: w, name: name, ok: !!ok, detail: detail == null ? '' : String(detail) });
  dirty = true;
  if (!ok) render();
}
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>]/g, function (m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]; }); }
function render() {
  dirty = false;
  var fail = 0, html = '';
  checks.forEach(function (c) {
    if (!c.ok) fail++;
    html += (c.ok ? '<span class="ok">OK </span>' : '<span class="bad">BAD</span> ') + c.w + ' · ' + esc(c.name) +
      (c.detail ? '  ' + esc(c.detail) : '') + '\n';
  });
  html += '\n점검 ' + checks.length + '건 · 실패 ' + fail + '건 · 콘솔에러 ' + errors.length + '건\n';
  if (errors.length) html += errors.slice(0, 8).join('\n') + '\n';
  html += new Date().toLocaleTimeString();
  out.innerHTML = html;
  sum.innerHTML = '<span class="' + (fail === 0 && errors.length === 0 ? 'ok' : 'bad') + '">' +
    (fail === 0 && errors.length === 0 ? 'PASS' : 'FAIL ' + fail) + '</span> · 점검 ' + checks.length +
    '건 · 콘솔에러 ' + errors.length + '건';
}
setInterval(function () { if (dirty) render(); }, 400);

/* ---------------- iframe 준비 ---------------- */
function desc(el) {
  var cls = typeof el.className === 'string' ? el.className : '';
  return el.id ? '#' + el.id : '<' + el.tagName.toLowerCase() + (cls ? ' .' + cls.split(' ').join('.') : '') + '>';
}
function scrollableAncestor(el, doc) {
  var p = el.parentElement;
  while (p && p !== doc.body) {
    var ox = getComputedStyle(p).overflowX;
    if (ox === 'auto' || ox === 'scroll') return true;
    p = p.parentElement;
  }
  return false;
}
function instrumentTTS(win) {
  win.__spoken = [];
  try {
    if (win.speechSynthesis) {
      var orig = win.speechSynthesis.speak.bind(win.speechSynthesis);
      win.speechSynthesis.speak = function (u) {
        try { win.__spoken.push({ text: u && u.text, rate: u && u.rate, lang: u && u.lang }); } catch (e) {}
        try { return orig(u); } catch (e) {}
      };
    }
  } catch (e) {}
}
function mkFrame(w) {
  var f = document.createElement('iframe');
  f.width = w; f.height = 900;
  f.style.width = w + 'px';
  f.style.height = '900px';
  /* 문서도 매번 새로 받는다 — index.html 이 브라우저 캐시(max-age 600)에 남아 있으면
     그 안의 app.js?v=... 참조까지 예전 것이라, 배포 직후 점검이 옛 코드를 재게 된다 */
  f.src = 'index.html?qa=1&cb=' + Date.now();
  f.dataset.w = w;
  document.getElementById('frames').appendChild(f);
  return f;
}
async function open(w) {
  /* 앱 서비스워커를 먼저 끊는다 — 이전 캐시가 iframe 내비게이션을 가로채면
     엉뚱한 문서(QA 페이지 등)가 뜨거나 캐시된 예전 app.js 가 섞인다 */
  if (!open.cleaned) {
    open.cleaned = true;
    try {
      var rs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(rs.map(function (r) { return r.unregister(); }));
    } catch (e) {}
    try {
      var ks = await caches.keys();
      await Promise.all(ks.map(function (k) { return caches.delete(k); }));
    } catch (e) {}
  }
  var f = mkFrame(w);
  /* iframe 은 about:blank → index.html 로 이동하므로 문서·윈도는 항상 새로 읽는다 */
  var ctx = {
    w: w, f: f,
    get doc() { return f.contentDocument; },
    get win() { return f.contentWindow; },
    q: function (s) { var d = f.contentDocument; return d ? d.querySelector(s) : null; },
    qa: function () { return f.contentWindow.__QA.state(); },
    ids: function () {
      try { return f.contentWindow.__QA.queueIds(); } catch (e) { return []; }
    },
    spoken: function () {
      var sp = f.contentWindow.__spoken;
      return sp && sp.length ? sp[sp.length - 1] : null;
    }
  };
  var t0 = Date.now();
  while (Date.now() - t0 < 12000) {
    var win = f.contentWindow;
    if (win && win.__QA && win.VOCAB_LV6 && win.VOCAB_LV4 && win.VOCAB_LV3 && win.VOCAB_LV2) break;
    await sleep(100);
  }
  await sleep(250);
  var win2 = f.contentWindow;
  win2.addEventListener('error', function (e) { errors.push(w + 'px error: ' + (e.message || e.type)); });
  win2.addEventListener('unhandledrejection', function (e) {
    errors.push(w + 'px reject: ' + ((e.reason && (e.reason.message || e.reason)) || '?'));
  });
  try {
    var ce = win2.console.error;
    win2.console.error = function () {
      errors.push(w + 'px console.error: ' + Array.prototype.join.call(arguments, ' '));
      return ce.apply(win2.console, arguments);
    };
  } catch (e) {}
  win2.confirm = function () { return true; };
  instrumentTTS(win2);
  rec(w, 'load:데이터', !!(win2.__QA && win2.VOCAB_LV6 && win2.VOCAB_LV4 && win2.VOCAB_LV3 && win2.VOCAB_LV2 && f.contentDocument.getElementById('footNote')),
    'LV2=' + !!win2.VOCAB_LV2 + ' LV6=' + !!win2.VOCAB_LV6 + ' vw=' + f.contentDocument.documentElement.clientWidth);
  return ctx;
}

/* ---------------- 화면 진단 ---------------- */
function boxScan(c, label) {
  var doc = c.doc, w = c.w, vw = doc.documentElement.clientWidth;
  var bad = [];
  doc.querySelectorAll('body *').forEach(function (el) {
    if (el.closest('[hidden]')) return;
    var r = el.getBoundingClientRect();
    if (!r.width && !r.height) return;
    if ((r.right > vw + 1 || r.left < -1) && !scrollableAncestor(el, doc)) {
      bad.push(desc(el) + '[' + Math.round(r.left) + '..' + Math.round(r.right) + ']');
    }
  });
  rec(w, '폭:' + label, bad.length === 0 && doc.documentElement.scrollWidth <= vw + 1,
    'scrollW=' + doc.documentElement.scrollWidth + ' vw=' + vw + (bad.length ? ' · ' + bad.slice(0, 3).join(', ') : ''));

  var sq = [];
  doc.querySelectorAll('body *').forEach(function (el) {
    if (el.closest('[hidden]') || el.children.length) return;
    var t = (el.textContent || '').trim();
    if (t.length < 4) return;
    var r = el.getBoundingClientRect();
    if (r.width > 0 && r.height > r.width * 3.2) sq.push(desc(el) + '(' + Math.round(r.width) + 'x' + Math.round(r.height) + ')');
  });
  rec(w, '글자쪼개짐:' + label, sq.length === 0, sq.slice(0, 3).join(', '));

  var ov = [];
  ['.tool-row', '.drill-actions', '.preset', '.mode-pick', '.tabbar', '.seg-full', '.seg-mini',
    '.chips-scroll', '.speak-tools', '.grade-row', '.btn-row', '.sr-acts', '.stat-row', '.sheet-actions'].forEach(function (sel) {
    doc.querySelectorAll(sel).forEach(function (box) {
      if (box.closest('[hidden]')) return;
      var kids = Array.prototype.slice.call(box.children).filter(function (k) { return !k.closest('[hidden]'); });
      for (var i = 0; i < kids.length; i++) {
        for (var j = i + 1; j < kids.length; j++) {
          var a = kids[i].getBoundingClientRect(), b = kids[j].getBoundingClientRect();
          if (!a.width || !b.width) continue;
          var ox = Math.min(a.right, b.right) - Math.max(a.left, b.left);
          var oy = Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top);
          if (ox > 3 && oy > 3) ov.push(sel + ' ' + (kids[i].textContent || '').trim().slice(0, 6) + '↔' + (kids[j].textContent || '').trim().slice(0, 6));
        }
      }
    });
  });
  rec(w, '겹침:' + label, ov.length === 0, ov.slice(0, 3).join(', '));
}

/* ---------------- 문제 풀이 (실제 클릭) ---------------- */
function modeNow(c) {
  if (c.q('#quizCard') && !c.q('#quizCard').hidden) return 'quiz';
  if (c.q('#blankCard') && !c.q('#blankCard').hidden) return 'blank';
  if (c.q('#orderCard') && !c.q('#orderCard').hidden) return 'order';
  if (c.q('#cardBox') && !c.q('#cardBox').hidden) return 'card';
  return 'none';
}
function curCard(c) {
  var st = c.qa();
  if (!st || !st.S || st.S.i >= st.S.queue.length) return null;
  return st.S.queue[st.S.i].c;
}
async function answerOne(c, ok) {
  var m = modeNow(c);
  var card = curCard(c);
  if (!card) return 'noq';
  if (m === 'quiz') {
    var ans = c.win.__QA.options().answer;
    var btns = Array.prototype.slice.call(c.doc.querySelectorAll('#quizOptions .opt'));
    var b = ok ? btns.filter(function (x) { return x.dataset.val === ans; })[0]
               : btns.filter(function (x) { return x.dataset.val !== ans; })[0];
    if (!b) return 'nobtn';
    b.click();
  } else if (m === 'blank') {
    var a2 = String(c.win.__QA.options().answer).toLowerCase();
    var bt2 = Array.prototype.slice.call(c.doc.querySelectorAll('#blankOptions .opt'));
    var eq = function (v) { return String(v).toLowerCase() === a2; };
    var b2 = ok ? bt2.filter(function (x) { return eq(x.dataset.val); })[0]
                : bt2.filter(function (x) { return !eq(x.dataset.val); })[0];
    if (!b2) return 'nobtn';
    b2.click();
  } else if (m === 'order') {
    var od = c.win.__QA.orderOf(card);
    if (!od) return 'noorder';
    var toks = ok ? od.toks.slice() : od.toks.slice().reverse();
    for (var i = 0; i < toks.length; i++) {
      var pool = Array.prototype.slice.call(c.doc.querySelectorAll('#tilePool .tile'));
      var tb = pool.filter(function (x) { return x.textContent === toks[i]; })[0];
      if (!tb) break;
      tb.click();
    }
    c.q('#orderCheck').click();
    await sleep(30);
    if (!ok && c.q('#feedback').hidden) { /* 1회 재시도 허용 — 두 번째 오답으로 확정 */
      for (var k = 0; k < toks.length; k++) {
        var pool2 = Array.prototype.slice.call(c.doc.querySelectorAll('#tilePool .tile'));
        var tb2 = pool2[0];
        if (!tb2) break;
        tb2.click();
      }
      c.q('#orderCheck').click();
      await sleep(30);
    }
  } else if (m === 'card') {
    c.q('#flipCard').click();
    await sleep(40);
    c.q(ok ? '#gradeRow .grade.good' : '#gradeRow .grade.bad').click();
    await sleep(30);
    return 'card';
  } else {
    return 'mode:' + m;
  }
  await sleep(30);
  var fb = c.q('#feedback');
  if (fb && !fb.hidden) c.q('#fbNext').click();
  await sleep(30);
  return m;
}
async function finishSet(c, max) {
  max = max || 16;
  var n = 0;
  while (n < max) {
    if (!c.q('#resultBox').hidden) break;
    if (!curCard(c)) break;
    await answerOne(c, true);
    n++;
    await sleep(12);
  }
  return { n: n, done: !c.q('#resultBox').hidden, total: c.q('#rTotal') ? c.q('#rTotal').textContent : '' };
}

/* ---------------- 시작 경로 ---------------- */
async function goHome(c) { c.q('.tab[data-tab="home"]').click(); await sleep(70); }
async function startMix(c, mode) {
  await goHome(c);
  c.q('#modePick .mode-chip[data-mode="' + (mode || 'quiz') + '"]').click();
  await sleep(40);
  c.q('#startBtn').click();
  await sleep(140);
}
async function startPreset(c, p, mode) {
  await goHome(c);
  c.q('#presetSeg .preset-btn[data-preset="' + p + '"]').click();
  await sleep(60);
  c.q('#modePick .mode-chip[data-mode="' + (mode || 'quiz') + '"]').click();
  await sleep(40);
  c.q('#startBtn').click();
  await sleep(140);
}
async function startLevel(c, lv, mode) {
  await goHome(c);
  c.q('#levelList .level-row:nth-child(' + lv + ')').click();
  await sleep(120);
  if (mode) { c.q('#modePick .mode-chip[data-mode="' + mode + '"]').click(); await sleep(40); }
  c.q('#lvStart').click();
  await sleep(150);
}
async function startConv(c, tag, mode) {
  await goHome(c);
  var chip = Array.prototype.slice.call(c.doc.querySelectorAll('#convTags .chip'))
    .filter(function (x) { return x.textContent.indexOf(tag) === 0; })[0];
  if (!chip) return 'notag';
  chip.click();
  await sleep(90);
  c.q('.conv-btn[data-conv="' + mode + '"]').click();
  await sleep(150);
  return '';
}
async function startDrill(c, tag, mode) {
  await goHome(c);
  var chip = Array.prototype.slice.call(c.doc.querySelectorAll('#drillTags .chip'))
    .filter(function (x) { return x.textContent.indexOf(tag) === 0; })[0];
  if (!chip) return 'notag';
  chip.click();
  await sleep(90);
  c.q('.drill-btn[data-drill="' + mode + '"]').click();
  await sleep(150);
  return '';
}
async function leaveStudy(c) {
  if (c.q('#resultBox') && !c.q('#resultBox').hidden) { c.q('#rHome').click(); await sleep(120); return; }
  if (c.q('#studyBack') && !c.q('#view-study').hidden) { c.q('#studyBack').click(); await sleep(140); }
  if (c.q('#view-speak') && !c.q('#view-speak').hidden) { c.q('#speakExit').click(); await sleep(120); }
  if (c.q('#chatRoom') && !c.q('#chatRoom').hidden) { c.win.__QA.chatClose(); await sleep(120); }
}
function levelsOf(c) {
  var st = c.qa();
  return st && st.S ? st.S.queue.map(function (q) { return q.c._lv; }) : [];
}
function uniq(a) { var o = {}; a.forEach(function (x) { o[x] = 1; }); return Object.keys(o).map(Number).sort(); }
function hasDup(a) { var o = {}; for (var i = 0; i < a.length; i++) { if (o[a[i]]) return true; o[a[i]] = 1; } return false; }

/* ---------------- 반복 출제 공통 ---------------- */
async function repeatSet(c, label, start, opts) {
  opts = opts || {};
  var err = await start();
  if (err) { rec(c.w, '반복:' + label, false, '시작 실패 ' + err); return; }
  var id1 = c.ids(), lv1 = levelsOf(c);
  var f1 = await finishSet(c);
  c.q('#rAgain').click();
  await sleep(200);
  var id2 = c.ids(), lv2 = levelsOf(c);
  var f2 = await finishSet(c);
  var overlap = id2.filter(function (x) { return id1.indexOf(x) > -1; });
  var lvOk = opts.lv ? lv2.length > 0 && lv2.every(function (l) { return l === opts.lv; }) : true;
  var inSetDup = hasDup(id1) || hasDup(id2);
  rec(c.w, '반복:' + label,
    id1.length === 10 && id2.length === 10 && f1.done && f2.done && overlap.length === 0 && lvOk && !inSetDup,
    '세트1 ' + id1.length + '(Lv ' + uniq(lv1).join(',') + ') · 세트2 ' + id2.length + '(Lv ' + uniq(lv2).join(',') + ')' +
    ' · 겹침 ' + overlap.length + (overlap.length ? ' [' + overlap.slice(0, 3).join(' / ') + ']' : '') +
    (inSetDup ? ' · 세트 안 중복' : '') +
    (f1.done ? '' : ' · 1세트 결과화면 미도달') + (f2.done ? '' : ' · 2세트 결과화면 미도달'));
  if (!c.q('#resultBox').hidden) { c.q('#rHome').click(); await sleep(120); }
  return { id1: id1, id2: id2 };
}

/* ============================================================
 *  A. 홈 — 모든 버튼
 * ============================================================ */
async function homeTests(c) {
  boxScan(c, 'home');
  var doc = c.doc, q = c.q;
  rec(c.w, '홈:수록 6,412', q('#footNote').textContent.indexOf('6,412') > -1, q('#footNote').textContent);
  rec(c.w, '홈:단계 6행', doc.querySelectorAll('#levelList .level-row').length === 6, 'rows=' + doc.querySelectorAll('#levelList .level-row').length);
  rec(c.w, '홈:탭 5개', doc.querySelectorAll('.tabbar .tab').length === 5, 'tabs=' + doc.querySelectorAll('.tabbar .tab').length);
  var tc = [q('#goSpeak'), q('#goChat')].map(function (b) { return b ? b.getBoundingClientRect().width : 0; });
  rec(c.w, '홈:도구 카드 2개 정상 폭', tc[0] > c.w * 0.4 && tc[1] > c.w * 0.4, 'speak=' + Math.round(tc[0]) + 'px chat=' + Math.round(tc[1]) + 'px');
  rec(c.w, '홈:이어서 카드 초기 숨김', q('#resumeCard').hidden, 'hidden=' + q('#resumeCard').hidden);

  /* 프리셋 3개 */
  var presets = ['mid', 'upper', 'pattern'], pd = [];
  for (var i = 0; i < presets.length; i++) {
    q('#presetSeg .preset-btn[data-preset="' + presets[i] + '"]').click();
    await sleep(70);
    pd.push(q('#presetDesc').textContent);
    var on = q('#presetSeg .preset-btn[data-preset="' + presets[i] + '"]').classList.contains('active');
    rec(c.w, '홈:프리셋 ' + presets[i], on && c.qa().preset === presets[i], q('#presetDesc').textContent);
  }
  q('#presetSeg .preset-btn[data-preset="upper"]').click();
  await sleep(60);

  /* 모드 칩 4개 */
  var modes = ['quiz', 'blank', 'order', 'card'];
  for (var m = 0; m < modes.length; m++) {
    q('#modePick .mode-chip[data-mode="' + modes[m] + '"]').click();
    await sleep(40);
    rec(c.w, '홈:모드칩 ' + modes[m], c.qa().store.settings.mode === modes[m] && q('#modePick .mode-chip[data-mode="' + modes[m] + '"]').classList.contains('active'), '');
  }
  q('#modePick .mode-chip[data-mode="quiz"]').click();
  await sleep(40);

  /* 속도 토글 */
  q('#speedBtn').click(); await sleep(60);
  var s1 = q('#speedBtn').textContent.indexOf('0.75') > -1 && Number(c.qa().speed) === 0.75;
  q('#speedBtn').click(); await sleep(60);
  var s2 = q('#speedBtn').textContent.indexOf('1.0') > -1 && Number(c.qa().speed) === 1;
  rec(c.w, '홈:속도 토글 0.75↔1.0', s1 && s2, q('#speedBtn').textContent);

  /* 테마 */
  var t0 = doc.documentElement.getAttribute('data-theme');
  q('#themeBtn').click(); await sleep(60);
  var t1 = doc.documentElement.getAttribute('data-theme');
  q('#themeBtn').click(); await sleep(60);
  var t2 = doc.documentElement.getAttribute('data-theme');
  rec(c.w, '홈:테마 전환', t0 !== t1 && t2 === t0, t0 + '→' + t1 + '→' + t2);

  /* 오답 빈 상태 */
  rec(c.w, '홈:오답 0건 안내', q('#weakChips').textContent.indexOf('아직 오답이 없어요') > -1, q('#weakChips').textContent.slice(0, 40));
  q('#startWeakBtn').click(); await sleep(120);
  rec(c.w, '홈:오답집중 0건 토스트', q('#toast').textContent.indexOf('오답 노트가 비어') > -1 && q('#view-study').hidden,
    q('#toast').textContent);

  /* 구문/회화 태그 */
  var dTags = doc.querySelectorAll('#drillTags .chip').length;
  var cTags = doc.querySelectorAll('#convTags .chip').length;
  rec(c.w, '홈:구문 태그', dTags >= 7, 'chips=' + dTags);
  rec(c.w, '홈:회화 상황 태그 13+전체', cTags === 14, 'chips=' + cTags);

  /* 구문/회화 태그 클릭 → 문구 갱신 */

/* ============================================================

 * ============================================================ */
function fbAudit(c, label) {
  var doc = c.doc;
  var html = c.q('#feedback') ? c.q('#feedback').innerHTML : '';
  var bad = /undefined|NaN|\[object/.test(html);
  var x = c.q('#feedback .fb-x');
  var lis = doc.querySelectorAll('#feedback .fb-opts li');
  var notes = Array.prototype.slice.call(doc.querySelectorAll('#feedback .fb-opts .ol-n'));
  var emptyNote = notes.filter(function (n) { return !n.textContent.trim(); });
  var right = doc.querySelectorAll('#feedback .fb-opts li.right').length;
  rec(c.w, '해설:' + label + ':맞춤 해설', !!x && x.textContent.trim().length > 25 && !bad, x ? x.textContent.slice(0, 60) : 'none');
  rec(c.w, '해설:' + label + ':보기별 뜻 4개', lis.length === 4 && notes.length === 4 && emptyNote.length === 0 && right === 1,
    'li=' + lis.length + ' notes=' + notes.length + ' empty=' + emptyNote.length + ' right=' + right);
  rec(c.w, '해설:' + label + ':듣기 버튼', !!(c.q('#fbSay') && c.q('#fbSaySlow')), 'fbSay=' + !!c.q('#fbSay'));
}

/* ============================================================
 *  D. 음성 — 단어/예문 듣기 · 0.75x

function spokeOk(c, expectText, expectRate, label) {
  var s = c.spoken();
  var textOk = s && expectText ? s.text === expectText : !!s;
  var rateOk = expectRate ? (s && Number(s.rate) === expectRate) : true;
  rec(c.w, '음성:' + label, textOk && rateOk, s ? ('"' + String(s.text).slice(0, 34) + '" @' + s.rate) : '재생 호출 없음');
}

async function repeatTests(c) {
  await repeatSet(c, '오늘 복습할 카드(mix)', function () { return startMix(c, 'quiz'); });
  await repeatSet(c, '새 카드', async function () {
    await goHome(c);
    c.q('#modePick .mode-chip[data-mode="quiz"]').click(); await sleep(40);
    c.q('#startNewBtn').click(); await sleep(140);
  });
  await repeatSet(c, '실전 회화·빈칸(카페·식당)', function () { return startConv(c, '카페·식당', 'blank'); });
  await repeatSet(c, '실전 회화·순서(직장·업무)', function () { return startConv(c, '직장·업무', 'order'); });
  await repeatSet(c, '실전 회화·뜻(여행·공항)', function () { return startConv(c, '여행·공항', 'quiz'); });
  await repeatSet(c, '구문 드릴·빈칸(연결·논리)', function () { return startDrill(c, '연결·논리', 'blank'); });
  await repeatSet(c, '구문 드릴·순서(의견·감정)', function () { return startDrill(c, '의견·감정', 'order'); });
  await repeatSet(c, '구문 드릴·뜻(비즈니스)', function () { return startDrill(c, '비즈니스', 'quiz'); });
  /* 태그 풀이 20장보다 작으면(사과·문제 12장) 두 번째 세트는 남은 2장 + 가장 먼저 본 8장으로 순환한다 */

    '세트1 ' + s1.length + ' · 세트2 ' + s2.length + ' · 겹침 ' + sov.length + '(12장 풀: 새 2장 먼저 + 순환 8장)');
  if (!c.q('#resultBox').hidden) { c.q('#rHome').click(); await sleep(120); }
  await goHome(c);
  await repeatSet(c, '단계 Lv.3', function () { return startLevel(c, 3, 'quiz'); }, { lv: 3 });
  await repeatSet(c, '단계 Lv.4', function () { return startLevel(c, 4, 'quiz'); }, { lv: 4 });
  await repeatSet(c, '단계 Lv.5', function () { return startLevel(c, 5, 'quiz'); }, { lv: 5 });
  await repeatSet(c, '단계 Lv.6', function () { return startLevel(c, 6, 'quiz'); }, { lv: 6 });
  await repeatSet(c, '프리셋 중급', function () { return startPreset(c, 'mid', 'quiz'); });
  await repeatSet(c, '프리셋 중상급', function () { return startPreset(c, 'upper', 'quiz'); });
  await repeatSet(c, '프리셋 구문', function () { return startPreset(c, 'pattern', 'quiz'); });

  /* 말하기 10문제 → 2세트 */

/* ============================================================
 *  X. v4.3.0 — 틀 사전 88개 · 청크 b 경계 정렬 · 내 발음 녹음/비교 · 교정 7일 추이+규칙 필터
 * ============================================================ */
async function v43PatternTests(c) {
  var q = c.q, qa = c.win.__QA;
  var bank = qa.patternBank();
  var keys = Object.keys(bank);
  rec(c.w, '틀사전:80개 이상', keys.length >= 88, 'n=' + keys.length);
  var all = qa.patternAll();
  var eligible = all.filter(function (x) { return x.frame; });
  var withChips = eligible.filter(function (x) { return x.slots.length; });
  var frames = {};
  eligible.forEach(function (x) { frames[x.frame.toLowerCase().replace(/\s+/g, ' ').trim()] = 1; });
  rec(c.w, '틀사전:게이트 통과 문장', eligible.length >= 116, 'eligible=' + eligible.length + '/' + all.length);
  rec(c.w, '틀사전:사전 칩 100%', eligible.length >= 116 && withChips.length === eligible.length,
    withChips.length + '/' + eligible.length);
  rec(c.w, '틀사전:틀 88개 이상', Object.keys(frames).length >= 88, 'frames=' + Object.keys(frames).length);
  var noBank = Object.keys(frames).filter(function (f) { return !bank[f]; });
  rec(c.w, '틀사전:모든 틀에 사전 있음', noBank.length === 0,
    'frames=' + Object.keys(frames).length + ' · 없음=' + noBank.length +
    (noBank.length ? ' [' + noBank.slice(0, 3).map(function (f) { return JSON.stringify(f); }).join(',') + ']' : ''));
  /* 사전 × 표현 = 생성 문장 전수 검사(관사 a/an·구두점·중복·길이·빈칸 잔여) */
  var VOW = /^[aeiou]/, HOUR = ['hour', 'hours', 'honest', 'honor', 'honour'];
  var probs = [], n = 0, seen = {};
  keys.forEach(function (k) {
    if (!Array.isArray(bank[k])) { probs.push('array:' + k); return; }
    if (!bank[k].length || bank[k].length > 4) probs.push('count:' + k);
    if (k.indexOf('___') < 0) probs.push('blank:' + k);
    bank[k].forEach(function (slot) {
      var sent = k.replace('___', slot);
      sent = sent.charAt(0).toUpperCase() + sent.slice(1);
      n++;
      if (/___/.test(sent)) probs.push('left:' + sent);
      if (/\s{2,}|\s[,.?!]/.test(sent)) probs.push('space:' + sent);
      if (seen[sent]) probs.push('dup:' + sent);
      seen[sent] = 1;
      if (slot.split(' ').length > 5) probs.push('long-slot:' + slot);
      if (sent.split(' ').length > 18) probs.push('long:' + sent);
      var t = sent.split(' ');
      for (var i = 1; i < t.length; i++) {
        var a = t[i - 1].toLowerCase().replace(/[.,!?;:]/g, ''), b = t[i].toLowerCase().replace(/[.,!?;:]/g, '');
        if (a === b) probs.push('repeat:' + sent);
        if (a === 'a' && VOW.test(b)) probs.push('a+vowel:' + sent);
        if (a === 'an' && b && !VOW.test(b) && HOUR.indexOf(b) < 0) probs.push('an+cons:' + sent);
      }
    });
  });
  rec(c.w, '틀사전:생성 문장 전수 검사', probs.length === 0,
    n + '문장 · 문제 ' + probs.length + (probs.length ? ' · ' + probs.slice(0, 3).join(' ; ') : ''));
  /* 새로 덮은 틀 — 지난 버전엔 칩이 없던 문장 */
  var p1 = qa.pattern("You're on mute.");
  rec(c.w, '치환:새 틀(You\'re)', !!p1 && p1.frame === "You're ___." && p1.slots.length === 3 &&
    p1.slots.indexOf('breaking up') > -1, p1 ? p1.frame + ' · ' + p1.slots.join(' / ') : 'none');
  var p2 = qa.pattern("That's one way to look at it.");
  rec(c.w, '치환:6단어 표현 틀', !!p2 && p2.slots.length === 3, p2 ? p2.frame + ' · ' + p2.slots.join(' / ') : 'none');
  var p3 = qa.pattern("Nothing seems to be going right.");
  rec(c.w, '치환:be+ing 틀', !!p3 && p3.slots.length === 3, p3 ? p3.frame : 'none');
  /* 어색한 문장을 만들지 않는 카드는 여전히 비어 있어야 한다 */
  rec(c.w, '치환:게이트 유지', qa.pattern('Keep the change.') === null && qa.pattern('Look before you leap.') === null, 'ok');
}

    var dump = '';

    rec(c.w, '녹음:저장 안 함', dump.indexOf('blob:') < 0 && dump.indexOf('audio/') < 0 &&
      dump.indexOf('MediaRecorder') < 0 && !('rec' in st) && !('audio' in st), 'storeLen=' + dump.length);
    /* 다음 카드로 넘어가면 녹음 상태 초기화 */
    q('#fbNext').click();
    await sleep(160);
    var rs3 = qa.recState();
    rec(c.w, '녹음:다음 카드 초기화', rs3.hasUrl === false && rs3.state === 'idle' && rs3.note === '',
      'state=' + rs3.state + ' note=' + rs3.note + ' gen=' + rs3.gen + ' box=' + rs3.box);
  }
  rec(c.w, '녹음:패널 확인', found, found ? 'ok' : '없음');
  await leaveStudy(c);
}

async function v43ChatTrendTests(c) {
  var q = c.q, qa = c.win.__QA, doc = c.doc;
  q('.tab[data-tab="chat"]').click(); await sleep(150);
  q('#topicGrid .topic[data-t="daily"]').click(); await sleep(170);
  q('#chatText').value = 'I very like this place.';
  q('#chatSend').click(); await sleep(650);
  q('#chatText').value = 'He go to school everyday.';
  q('#chatSend').click(); await sleep(650);
  q('#chatText').value = 'I very like this music.';
  q('#chatSend').click(); await sleep(650);
  qa.chatClose(); await sleep(170);
  var fx = qa.fixStats();
  var sum = fx.week7.reduce(function (s, d) { return s + d.n; }, 0);
  rec(c.w, '교정추이:7일 집계', typeof fx.week === 'number' && fx.week >= fx.today && fx.week7.length === 7,
    'week=' + fx.week + ' today=' + fx.today + ' prev=' + fx.prevWeek);
  rec(c.w, '교정추이:막대 합=7일', sum === fx.week, sum + ' vs ' + fx.week + ' [' + fx.week7.map(function (d) { return d.n; }).join(',') + ']');
  rec(c.w, '교정추이:문구', q('#chatStats').textContent.indexOf('최근 7일 ' + fx.week + '곳') > -1, q('#chatStats').textContent);
  rec(c.w, '교정추이:막대 7칸', doc.querySelectorAll('#chatFixTrend .fix-bars i').length === 7,
    'n=' + doc.querySelectorAll('#chatFixTrend .fix-bars i').length);
  rec(c.w, '교정추이:지난주 대비 문구', /지난 7일/.test(q('#chatFixTrend').textContent), q('#chatFixTrend').textContent.slice(0, 44));
  rec(c.w, '교정추이:오늘 막대', doc.querySelectorAll('#chatFixTrend .fix-bars i.today').length === 1, '');
  boxScan(c, 'chat-fixtrend');
  var chips = doc.querySelectorAll('#chatFixTop .fix-top-chip');
  var rowsBefore = doc.querySelectorAll('#chatHistory .hrow').length;
  rec(c.w, '교정필터:칩 버튼', chips.length >= 1 && chips[0].tagName === 'BUTTON', chips.length + '개');
  if (chips.length) {
    var pick = null;
    for (var i = 0; i < chips.length; i++) { if (Number((chips[i].querySelector('b') || {}).textContent) < rowsBefore) { pick = chips[i]; break; } }
    if (!pick) pick = chips[0];
    var why = pick.dataset.why;
    pick.click(); await sleep(150);
    var rowsAfter = doc.querySelectorAll('#chatHistory .hrow').length;
    rec(c.w, '교정필터:걸러짐', rowsAfter >= 1 && rowsAfter <= rowsBefore, 'before=' + rowsBefore + ' after=' + rowsAfter);
    var fl = q('#chatFixTop .fix-filter');
    rec(c.w, '교정필터:안내', !!fl && fl.textContent.indexOf(why) > -1, fl ? fl.textContent.slice(0, 40) : 'none');
    rec(c.w, '교정필터:활성 칩', doc.querySelectorAll('#chatFixTop .fix-top-chip.on').length === 1, '');
    boxScan(c, 'chat-fixfilter');
    q('#fixFilterClear').click(); await sleep(150);
    rec(c.w, '교정필터:전체 보기', doc.querySelectorAll('#chatHistory .hrow').length === rowsBefore && !q('#chatFixTop .fix-filter'), '');
    rec(c.w, '교정필터:드릴 버튼 유지', !q('#chatFixDrill').hidden && q('#chatFixDrill').textContent.indexOf('10문제') > -1, q('#chatFixDrill').textContent);
  }
}

async function resetTests(c) {
  var q = c.q;
  q('.tab[data-tab="stats"]').click(); await sleep(140);
  q('#resetBtn').click(); await sleep(200);
  var st = c.qa().store;
  var todayN = 0;
  Object.keys(st.stats).forEach(function (k) { todayN += (st.stats[k].n || 0); });
  rec(c.w, '초기화:기록 삭제', Object.keys(st.cards).length === 0 && todayN === 0 && Object.keys(st.modes).length === 0,
    'cards=' + Object.keys(st.cards).length + ' 오늘푼수=' + todayN + ' modes=' + Object.keys(st.modes).length);
  rec(c.w, '초기화:토스트', q('#toast').textContent.indexOf('기록') > -1, q('#toast').textContent);
  await goHome(c);
  rec(c.w, '초기화:홈 반영', q('#tTodayN').textContent === '0' && q('#weakCount').textContent === '0',
    'today=' + q('#tTodayN').textContent + ' weak=' + q('#weakCount').textContent);
}

/* ============================================================
 *  K. v4.0 S급 — 오늘 목표 · 복습 예보 · 콤보/도트 · 틀린 카드만 다시 · 자동 발음 · 쉐도잉
 * ============================================================ */
async function sGradeTests(c) {
  var q = c.q, doc = c.doc, qa = c.win.__QA;
  await goHome(c);

  /* 오늘 목표 */
  var g0 = qa.goal();
  var todayN = +q('#tTodayN').textContent;
  rec(c.w, '목표:홈 게이지', /오늘 목표 \d+문제/.test(q('#goalLbl').textContent) && g0.val === todayN + ' / ' + g0.goal,
    q('#goalLbl').textContent + ' · ' + g0.val);
  var wantW = Math.min(100, Math.round(todayN / g0.goal * 100));
  rec(c.w, '목표:게이지 폭', Math.abs(parseFloat(q('#goalBar').style.width || '0') - wantW) <= 1,
    'width=' + q('#goalBar').style.width + ' 기대=' + wantW + '%');
  rec(c.w, '목표:안내 문구', q('#goalNote').textContent.length > 4, q('#goalNote').textContent.slice(0, 40));

  /* 복습 예보 */
  var fc = qa.forecast();
  rec(c.w, '예보:칩 표시', fc.indexOf('복습 예보') > -1 && /(지금|오늘|내일|이번 주) \d+/.test(fc), fc.slice(0, 90));

  /* 세션 도트 + 콤보 */
  await startMix(c, 'quiz');
  rec(c.w, '도트:10칸', doc.querySelectorAll('#studyDots i').length === 10, 'dots=' + doc.querySelectorAll('#studyDots i').length);
  rec(c.w, '콤보:처음엔 숨김', q('#comboPill').hidden === true, 'hidden=' + q('#comboPill').hidden);
  await answerOne(c, true);
  await answerOne(c, true);
  var cmb = qa.combo();
  rec(c.w, '콤보:2연속 표시', cmb.combo === 2 && !q('#comboPill').hidden && q('#comboPill').textContent.indexOf('2') > -1,
    'combo=' + cmb.combo + ' · ' + q('#comboPill').textContent);
  rec(c.w, '도트:정답 표시', doc.querySelectorAll('#studyDots i.ok').length === 2, 'ok=' + doc.querySelectorAll('#studyDots i.ok').length);
  await answerOne(c, false);
  var cmb2 = qa.combo();
  rec(c.w, '콤보:오답에 끊김', cmb2.combo === 0 && doc.querySelectorAll('#studyDots i.no').length === 1,
    'combo=' + cmb2.combo + ' · no=' + doc.querySelectorAll('#studyDots i.no').length);

  /* 세션 끝까지 → 결과 화면 */
  var guard = 0;
  while (q('#resultBox').hidden && guard++ < 24) await answerOne(c, guard % 3 !== 0);
  var rc = q('#rCombo').textContent;
  rec(c.w, '결과:콤보 요약', /최고 연속 정답 \d+ · 정답률 \d+% · 오늘 \d+문제/.test(rc), rc);
  rec(c.w, '결과:모드 전환 숨김', q('#modeSwitch').hidden === true, 'hidden=' + q('#modeSwitch').hidden);
  var fin = qa.state().S;
  var wrongWords = [];
  (fin ? fin.answers : []).forEach(function (a) { if (!a.ok && wrongWords.indexOf(a.w) < 0) wrongWords.push(a.w); });
  var rw = q('#rWeak');
  rec(c.w, '결과:틀린 카드만 다시 버튼', !rw.hidden && rw.textContent.indexOf('틀린 ' + wrongWords.length + '개') === 0,
    rw.hidden ? 'hidden' : rw.textContent + ' (틀린 ' + wrongWords.length + '개)');
  if (!rw.hidden) {
    rw.click(); await sleep(220);
    var retryFirst = (qa.state().S.queue[0] || {}).c;
    rec(c.w, '결과:틀린 카드부터 10문제', !q('#view-study').hidden && q('#studyCounter').textContent === '1/10' &&
      !!retryFirst && wrongWords.indexOf(retryFirst.w) > -1,
      'counter=' + q('#studyCounter').textContent + ' · 첫 카드=' + (retryFirst ? retryFirst.w : '?'));
    rec(c.w, '결과:모드 전환 복귀', q('#modeSwitch').hidden === false, 'hidden=' + q('#modeSwitch').hidden);
    await leaveStudy(c);
  }

  /* 자동 발음 설정 */
  q('.tab[data-tab="stats"]').click(); await sleep(160);
  var tg = q('#autoSayToggle');
  rec(c.w, '설정:자동 발음 토글 존재', !!tg, tg ? tg.getAttribute('aria-checked') : 'none');
  if (tg) {
    var on0 = tg.getAttribute('aria-checked') === 'true';
    tg.click(); await sleep(80);
    rec(c.w, '설정:자동 발음 켜짐', (tg.getAttribute('aria-checked') === 'true') !== on0, 'now=' + tg.getAttribute('aria-checked'));
    var w0 = (c.win.__spoken || []).length;
    await goHome(c); await startMix(c, 'quiz');
    await sleep(700);
    var sp = c.spoken();
    var word = q('#quizWord').textContent;
    rec(c.w, '자동발음:카드 읽기', (c.win.__spoken || []).length > w0 && !!sp && sp.text === word,
      'spoken=' + (sp && sp.text) + ' / word=' + word);
    await leaveStudy(c);
    q('.tab[data-tab="stats"]').click(); await sleep(140);
    q('#autoSayToggle').click(); await sleep(80);
    rec(c.w, '설정:자동 발음 꺼짐', q('#autoSayToggle').getAttribute('aria-checked') === 'false', q('#autoSayToggle').getAttribute('aria-checked'));
  }

  /* 해설의 「따라 말하기」(쉐도잉) */
  await goHome(c); await startMix(c, 'quiz');
  await answerOne(c, true);
  var sb = q('#fbShadow');
  rec(c.w, '쉐도잉:해설에 버튼', !!sb || !c.win.SpeechRecognitionClass, 'mic지원=' + (!!sb));
  if (sb) {
    sb.click(); await sleep(260);
    rec(c.w, '쉐도잉:누르면 안내 표시', !q('#fbShadowOut').hidden, (q('#fbShadowOut').textContent || '').slice(0, 40));
  }
  await leaveStudy(c);
  await goHome(c);
}

/* ============================================================
 *  실행
 * ============================================================ */
async function section(name, ctx, fn) {
  var before = checks.length;
  try { await fn(ctx); } catch (e) {
    rec(ctx.w, 'EXC:' + name, false, (e && (e.stack || e.message)) || String(e));
  }
  if (checks.length === before) rec(ctx.w, '미실행:' + name, false, '검사 없음');
  render();
}

async function run() {
  var ctxs = [];
  for (var i = 0; i < WIDTHS.length; i++) ctxs.push(await open(WIDTHS[i]));
  for (var j = 0; j < ctxs.length; j++) await section('home', ctxs[j], homeTests);
  for (var k = 0; k < ctxs.length; k++) await section('screens', ctxs[k], screenTests);
  var deep = ctxs[ctxs.length - 1];
  await section('repeat', deep, repeatTests);
  await section('explain', deep, explainTests);
  await section('audio', deep, audioTests);
  await section('weak', deep, weakTests);
  await section('resume', deep, resumeTests);
  await section('chat', deep, chatTests);
  await section('list', deep, listTests);
  await section('stats', deep, statsTests);
  await section('back', deep, backTests);
  await section('buttons', deep, buttonSweep);
  await section('sgrade', deep, sGradeTests);
  await section('ladder', deep, chatLadderTests);
  await section('chatfix', deep, chatFixTests);
  await section('recall', deep, recallTests);
  for (var v = 0; v < ctxs.length; v++) await section('v42panel', ctxs[v], v42PanelTests);
  await section('v42speak', deep, v42SpeakTests);
  await section('v42chatfix', deep, v42ChatFixTests);
  await section('v42recall', deep, v42RecallTests);
  for (var x1 = 0; x1 < ctxs.length; x1++) await section('v43pattern', ctxs[x1], v43PatternTests);
  for (var x2 = 0; x2 < ctxs.length; x2++) await section('v43chunk', ctxs[x2], v43ChunkTests);
  await section('v43rec', deep, v43RecTests);
  await section('v43chat', deep, v43ChatTrendTests);
  await section('reset', deep, resetTests);
  rec(deep.w, '콘솔에러 0건', errors.length === 0, errors.slice(0, 5).join(' | '));
  render();
  document.title = (checks.filter(function (x) { return !x.ok; }).length ? 'FAIL ' : 'PASS ') + checks.length + ' checks';
}
run();
</script>
